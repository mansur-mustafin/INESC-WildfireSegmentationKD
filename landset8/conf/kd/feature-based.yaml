# Define some constants

defaults:
  - _self_

hydra:
  run:
    dir: outputs/

model:
  # name: "cgnet"
  # name: "fddwnet"
  name: "enet"
  # name: "unet"
  # name: "lraspp"
  # name: "fcn_resnet50"
  # name: "fcn_resnet101"
  # name: "deeplabv3_resnet50"
  # name: "deeplabv3_resnet101"
  # name: "deeplabv3_mobilenet_v3_large"

teacher:
  # name: "lraspp"
  # name: "fcn_resnet50"
  # name: "fcn_resnet101"
  # name: "deeplabv3_resnet50"
  # name: "deeplabv3_resnet101"
  # name: "deeplabv3_mobilenet_v3_large"
  name: "unet"


path:
  teacher_model: "./weights/landset8_default/4/unet_66_val_0.00_f1_0.91.pt"

  dataset: "./../datasets/Landsat8-ActiveFire/"

  output_model: "weights/kd/test/"
  weights_test: "weights/kd/test/"           # folder which models to test


const:
  lr: 0.001
  num_epochs: 500
  batch_size: 16
  num_input_channels: 3                    
  num_classes: 1                            # 0 - no fire, 1 - fire 
  weight_decay: 0                           # L2 regularization.
  lbd: 500
  mask: "voting"                            # Kumar, Schroeder, Murphy, intersections, voting
  th_fire: 0.25
  dropout: 0.1
  n_filters: 16

distill:
  T: 1.0
  alpha: 0.5
  lbd: 300
