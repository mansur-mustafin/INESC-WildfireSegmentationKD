path:
  dataset: "./../datasets/Landsat8-ActiveFire/"

  output_model: "weights/landset8_default/6/"
  weights_test: "weights/landset8_default/6/"           # folder which models to test

const:
  lr: 0.001
  num_epochs: 100
  batch_size: 16
  num_input_channels: 3                    
  num_classes: 1                            # 0 - no fire, 1 - fire 
  weight_decay: 0                           # L2 regularization.
  lbd: 500
  mask: "voting"                            # Kumar, Schroeder, Murphy, intersections, voting
  th_fire: 0.25
  dropout: 0.1
  n_filters: 16
